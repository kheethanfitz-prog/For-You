<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .initial-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd4eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1s ease, transform 1s ease;
        }

            .initial-screen.hidden {
                opacity: 0;
                transform: scale(1.1);
                pointer-events: none;
            }

        .open-button {
            position: relative;
            padding: 28px 65px;
            font-size: 26px;
            font-family: 'Philosopher', sans-serif;
            font-weight: 700;
            color: #c2185b;
            background: white;
            border: 3px solid #f48fb1;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 30px rgba(244, 143, 177, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

            .open-button:hover {
                transform: translateY(-5px) scale(1.05);
                box-shadow: 0 15px 45px rgba(244, 143, 177, 0.5);
                background: linear-gradient(135deg, #fff 0%, #ffe0f0 100%);
                border-color: #e91e63;
            }

            .open-button:active {
                transform: translateY(-2px) scale(1.02);
            }

        .flower-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            opacity: 0;
            transition: opacity 1.2s ease 0.3s;
        }

            .flower-page.visible {
                opacity: 1;
            }

        .flower-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./bouquet.png');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

            .flower-background::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, rgba(252, 228, 236, 0.1) 0%, rgba(248, 187, 208, 0.05) 50%, rgba(244, 143, 177, 0.1) 100%);
            }

        .message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: fadeInMessage 1.5s ease 2s forwards;
        }

        @keyframes fadeInMessage {
            to {
                opacity: 1;
            }
        }

        .message {
            font-size: 52px;
            font-weight: 600;
            color: #fff;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.9), 5px 5px 20px rgba(0, 0, 0, 0.8), -2px -2px 10px rgba(0, 0, 0, 0.7), 0 0 30px rgba(194, 24, 91, 0.8);
            line-height: 1.6;
            letter-spacing: 2px;
            max-width: 90vw;
        }

            .message::before {
                content: '💐';
                display: block;
                font-size: 70px;
                margin-bottom: 20px;
                animation: pulse 2s ease-in-out infinite;
            }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        @media (max-width: 768px) {
            .message {
                font-size: 32px;
            }

                .message::before {
                    font-size: 50px;
                }

            .open-button {
                font-size: 20px;
                padding: 20px 45px;
            }
        }
    </style>
</head>
<body>
    <div class="initial-screen" id="initialScreen">
        <button class="open-button" id="openButton">Open</button>
    </div>

    <div class="flower-page" id="flowerPage">
        <div class="flower-background"></div>

        <div class="message-container">
            <div class="message">
                Hey gorgeous, since I couldn't<br>give you the flowers today<br>I thought of this
            </div>
        </div>
    </div>

    <script>
        const openButton = document.getElementById('openButton');
        const initialScreen = document.getElementById('initialScreen');
        const flowerPage = document.getElementById('flowerPage');
        let clickCount = 0;

        openButton.addEventListener('click', function (e) {
            clickCount++;

            if (clickCount < 4) {
                e.preventDefault();

                // Get viewport dimensions
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                const buttonWidth = openButton.offsetWidth;
                const buttonHeight = openButton.offsetHeight;

                // Calculate random position (keeping button fully visible)
                const maxX = viewportWidth - buttonWidth - 40;
                const maxY = viewportHeight - buttonHeight - 40;
                const randomX = Math.random() * maxX + 20;
                const randomY = Math.random() * maxY + 20;

                // Move button to new position
                openButton.style.position = 'absolute';
                openButton.style.left = randomX + 'px';
                openButton.style.top = randomY + 'px';
                openButton.style.transition = 'all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55)';

                // Add shake animation
                openButton.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    openButton.style.animation = '';
                }, 500);
            } else {
                // On 4th click, open the page
                initialScreen.classList.add('hidden');
                flowerPage.classList.add('visible');
            }
        });
    </script>

    <style>
        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px) rotate(-5deg);
            }

            75% {
                transform: translateX(10px) rotate(5deg);
            }
        }
    </style>

</body>
</html>
